<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>ゆる〜り日記🥰</title>
  <meta name="description" content="体調・気分・服薬などをやさしく記録する日記アプリ">
  <meta name="theme-color" content="#fde4ec">
  <meta name="color-scheme" content="light">
  <meta name="format-detection" content="telephone=no">
  <meta name="robots" content="noindex">
  <!-- iPhone 用(ホーム画面のアイコン名・ステータスバー) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ゆる〜り日記">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/feedback.css">
  <script src="js/version.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <button type="button" class="hdr-btn" id="hdr-back" aria-label="もどる" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h1 class="app-title" id="hdr-title">ゆる〜り日記🥰</h1>
      <a class="hdr-btn" id="hdr-settings" href="#/settings" aria-label="設定">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </a>
    </header>

    <div class="update-bar" id="update-bar" hidden>
      <p class="update-text">新しいバージョンがあります<br><span class="small">念のため、更新の前にバックアップを取っておくと安心です</span></p>
      <div class="update-actions">
        <a class="btn btn-small" id="update-backup" href="#/backup">バックアップ</a>
        <button type="button" class="btn btn-small btn-primary" id="update-apply">更新する</button>
      </div>
    </div>

    <main class="view" id="view">
      <noscript><div class="card">JavaScript をオンにしてください。</div></noscript>
    </main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
